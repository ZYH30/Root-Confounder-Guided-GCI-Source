[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gci-final-set-validation"
version = "1.0.0"
description = "Final adjustment-set and downstream inference validation for GCI"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "networkx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
